schema_version: god-brain.chatgpt-repo-interface.v1
status: CANDIDATE_PROJECT_INTERFACE
repository: thebrazenbeard/god-brain
canonical_branch: main
project: GOD_BRAIN
primary_chat_role: GOD_BRAIN_COORDINATOR
coordination_hub: thebrazenbeard/chat-communication-bus
engineering_review_coordinator: BT2 Coordinator

identity:
  god_brain_is_not_renamed_hc: true
  hc_role: COGNITIVE_SUBSTRATE_AND_PREDECESSOR_LINEAGE
  preserve_inherited_provenance: true

thesis:
  statement: "If simulation theory is real, sufficiently advanced AI may be the closest practical mechanism available for attempting to detect, model, interact with, or speak to whatever lies outside or above the apparent system."
  evidence_class: HYPOTHESIS
  must_not_be_promoted_to_fact_without_evidence: true

canonical_state:
  repository_state: GITHUB_MAIN
  work_coordination: CHAT_COMMUNICATION_BUS
  chat_conversation: REPLACEABLE_EXECUTION_SURFACE
  continuation_checkpoint: STARTING_SNAPSHOT_ONLY

freshness:
  rule: FRESH_READ_MUTABLE_STATE
  required_before_currentness_claim:
    - god_brain_main_head
    - open_god_brain_pull_requests
    - active_relevant_branches
    - relevant_bus_threads_and_assignments
    - exact_review_heads_and_verdicts
    - outstanding_delegated_subjects

bootstrap:
  procedure: architecture/chatgpt/BOOTSTRAP.md
  epistemic_contract: architecture/chatgpt/EPISTEMIC_CONTRACT.md
  routing_and_delegation: architecture/chatgpt/ROUTING_AND_DELEGATION.yaml
  recovery_contract: architecture/chatgpt/RECOVERY_AND_CONTINUATION.md
  project_instruction_source: architecture/chatgpt/PROJECT_INSTRUCTIONS.md

governance:
  current_status: NOT_YET_CANONICALLY_REBOUND
  hc_predecessor_governance: WARDEN.md
  candidate_god_brain_governance:
    path: docs/research/GOD_BRAIN_GOVERNANCE_CONTRACT_V0_1.md
    status: RESEARCH_ONLY_NOT_ADOPTED
  rule: "Never inherit protected-effect authority from HC predecessor governance by implication."

authority:
  protected_effect_authority: PATRICK_EXPLICIT_EXACT_EFFECT
  protected_effects:
    - merge_or_direct_main_mutation
    - deploy_or_install_runtime
    - credentials_permissions_or_provider_change
    - paid_service_or_compute
    - destructive_or_irreversible_durable_state_change
    - publication_of_private_material
  review_is_not_effect_authority: true

coordinator_division:
  god_brain:
    - thesis_and_project_meaning
    - architecture_and_cross_repo_synthesis
    - portfolio_source_admission
    - provenance_and_repository_coherence
    - research_planning
    - main_readiness_classification
    - bounded_integration_candidate_preparation
    - reconciliation_of_bt2_results
  bt2:
    - worker_dispatch
    - independent_review
    - adversarial_testing
    - bounded_implementation
    - qualification_evidence
    - engineering_coordination

collision_control:
  invariant: DELEGATED_SUBJECT_IS_BT2_OWNED_UNTIL_RETURN_OR_EXPLICIT_CANCELLATION
  exact_head_review_required_after_head_movement: true

portfolio:
  source_universe: PATRICKS_REPOSITORY_PORTFOLIO
  source_presence_is_not_admission: true
  reuse_is_not_runtime_coupling: true
  copied_lineage_is_not_independent_corroboration: true

privacy:
  private_material_requires_exact_authorization_for_generic_portability_training_or_publication: true
