schema_version: HC_DISTRIBUTED_NOOPLEX_HCDN_FIXTURE_SCHEMA_V0_1
status: RESEARCH_FIXTURE_SCHEMA
qualification_subject: HC_DISTRIBUTED_NOOPLEX_OPERATION_CONTRACT_V0_1_R2

required_fixture_fields:
  - case_id
  - deterministic
  - source_case_title
  - contract_clause_refs
  - initial_state
  - input
  - expectation_provenance
  - expected
  - must_not_occur

semantics:
  fixture_expectation_ne_implementation_result: true
  hostile_case_pass_ne_behavioral_qualification: true
  exact_subject_binding_required: true
  unknown_or_underspecified_runtime_detail_must_not_be_invented: true

field_definitions:
  case_id: Stable hostile-case identifier from the reviewed hostile set.
  deterministic: Whether the fixture expectation is intended to be deterministically checkable.
  source_case_title: Human-readable title from the reviewed hostile set.
  contract_clause_refs: Normative contract sections relied upon by the vector.
  initial_state: Pre-input logical state required by the case.
  input: Abstract protocol/effect event supplied to a future conformance harness.
  expected: Required observable disposition/state transition.
  must_not_occur: Explicit forbidden outcomes.
  expectation_provenance: Required per-dimension provenance map for the expected block.

provenance_rules:
  required_for_every_fixture: true
  required_for_every_top_level_expected_dimension: true
  unknown_provenance_key_forbidden: true
  provenance_key_without_matching_expected_dimension_forbidden: true
  expected_dimension_without_matching_provenance_key_forbidden: true
  closed_vocabulary:
    - NORMATIVE_CONTRACT
    - REVIEWED_HOSTILE_EXPECTATION
    - NORMATIVE_CONTRACT_AND_REVIEWED_HOSTILE_EXPECTATION
    - SETUP_STATE_AND_REVIEWED_HOSTILE_EXPECTATION
  variants:
    provenance_key: variants
    provenance_applies_to_entire_variant_matrix: true
    nested_variant_names_are_scenario_labels_not_expected_dimensions: true
  unknown_label_disposition: REJECT_FIXTURE

expected_value_forms:
  scalar_symbol:
    semantics: Opaque fixture/harness symbol. Do not infer alternatives by parsing token text.
  boolean:
    semantics: Literal boolean expectation.
  one_of:
    semantics: Explicit acceptable-outcome set; any listed member satisfies the expected dimension.
    minimum_members: 2
    duplicate_members_forbidden: true
  variants:
    semantics: Named input-scenario matrix whose nested expected leaves are governed by the variants provenance entry.
  implicit_or_from_string_forbidden: true
  unknown_structural_operator_disposition: REJECT_FIXTURE

expected_dimension_rules:
  allowed_dimensions_apply_recursively_inside_variants: true
  top_level_expected_keys_must_match_provenance_keys_exactly: true

allowed_expected_dimensions:
  - admission_disposition
  - routing_state
  - incorporation_state
  - effect_state
  - effect_executed
  - receipt_projection
  - duplicate_disposition
  - reconciliation_action
  - sequence_state
  - required_refresh
  - conflict_reason
  - variants
  - retry_reuses_operation_id
  - historical_receipt_retention_allowed
  - incorporation_constraint
  - truth_or_belief_promotion
  - continuity_write_disposition
  - bounded_local_operation_constraint
  - partition_state
  - ownership_state
  - plasticity_update
  - identity_or_value_promotion
  - health_state
  - protected_work_admission
  - authority_change
  - effect_verification_constraint
  - target_operation_identity_constraint
  - exact_subject_handling
  - authority_evidence_revalidation
  - epistemic_type_promotion
