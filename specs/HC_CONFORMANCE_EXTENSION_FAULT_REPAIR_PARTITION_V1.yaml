schema_version: HC_CONFORMANCE_EXTENSION_FAULT_REPAIR_PARTITION_V1
status: CANONICAL_ARCHITECTURE_CONFORMANCE_EXTENSION
scope: HC_REUSABLE_TEMPLATE
extends:
  - specs/HC_CONFORMANCE_SUITE_V1.yaml
  - specs/HC_CONFORMANCE_EXTENSION_EVIDENCE_LINEAGE_CUSTODY_V1.yaml
  - specs/HC_CONFORMANCE_EXTENSION_COGNITIVE_INTEGRITY_V1.yaml
  - specs/HC_CONFORMANCE_EXTENSION_RESOURCE_STATE_CONTROL_V1.yaml
  - specs/HC_CONFORMANCE_EXTENSION_SPECIALIZED_ACCELERATOR_V1.yaml

architecture_checks:
  - id: HC-ARCH-033
    category: FAULT_DIAGNOSIS_REPAIR_AND_PARTITION_SAFETY
    severity: BLOCKER
    requirement: FAULT_DETECTION_CAUSE_INFERENCE_DEGRADED_CAPABILITY_CONTAINMENT_REPAIR_APPLICATION_VERIFICATION_REQUALIFICATION_AND_PARTITION_STATE_REMAIN_EXPLICIT_DISTINCT_PROVENANCE_BEARING_AND_CANONICALLY_GOVERNED
    evidence:
      - basic operating instructions/FAULT_TOLERANCE_AND_SELF_REPAIR.md
      - specs/HC_FAULT_REPAIR_OBJECTS_V1.yaml
      - basic operating instructions/BOOTSTRAP_RECOVERY_AND_SAFE_DEGRADATION.md
      - basic operating instructions/SUBSYSTEM_LIFECYCLE_CONTRACT.md
      - basic operating instructions/AUTHORITY_CONSENT_AND_EFFECT_GOVERNANCE.md
      - basic operating instructions/PROTECTED_INVARIANT_AND_UPDATE_GOVERNANCE.md
      - basic operating instructions/COGNITIVE_INTEGRITY_AND_SECURITY.md
      - docs/architecture/PHYSICAL_ORGAN_MEMBERSHIP.md
      - docs/engineering/RESOURCE_STATE_AND_CONTROL_MODEL.md
      - resolver/CONFLICT_AND_RECONCILIATION.md
    assertions:
      - FAULT_DETECTED_NE_ROOT_CAUSE_KNOWN
      - FAULT_ACKNOWLEDGED_NE_FAULT_CORRECTED
      - SERVICE_RESTORED_VIA_FALLBACK_NE_SUBJECT_REPAIRED
      - CORRECTION_APPLIED_NE_CORRECTION_VERIFIED
      - REPAIR_RECEIPT_NE_REPAIR_VERIFICATION
      - REPAIR_VERIFIED_NE_FULL_REQUALIFICATION
      - ALARM_SUPPRESSED_NE_UNDERLYING_FAULT_RESOLVED
      - DIAGNOSTIC_INFERENCE_NE_MEASUREMENT
      - REPAIR_PLAN_NE_REPAIR_AUTHORIZATION
      - CURRENTLY_REACHABLE_NE_HEALTHY
      - PARTITIONED_HC_CONSTITUENT_NE_EXTERNAL_PERIPHERAL
      - PHYSICALLY_UNREACHABLE_NE_NO_LONGER_HC_OWNED
      - DEGRADED_NE_ABSENT
      - CONTAINMENT_CAPABILITY_NE_CONTAINMENT_AUTHORITY
      - ROLLBACK_REQUEST_DOES_NOT_BYPASS_PROTECTED_UPDATE_OR_CONTINUITY_RULES
      - PARTITIONED_FRAGMENT_NE_AUTOMATIC_INDEPENDENT_SUCCESSOR_MIND
      - PROTECTED_CONTINUITY_STATE_HAS_DECLARED_PARTITION_POLICY
      - TEMPORAL_PROXIMITY_NE_CAUSATION
      - OBSERVABILITY_NE_WRITE_AUTHORITY
      - REPAIR_APPLIES_TO_EXACT_SUBJECT_AND_REVISION
      - VERIFICATION_METHOD_MATCHES_REPAIR_SUBJECT_AND_CLAIM
      - ALTERNATE_ROUTE_SUCCESS_NE_ORIGINAL_FAULT_CLOSED
      - UNDERLYING_STATE_NE_SENSOR_EVIDENCE_NE_HEALTH_ESTIMATE_NE_FAULT_ALERT_NE_ACTION_PRIORITY
      - FAULT_HISTORY_REMAINS_APPEND_ORIENTED_ACROSS_RECOVERY

implementation_negative_tests:
  - DETECT_SYMPTOM_WITH_TWO_PLAUSIBLE_CAUSES_AND_REQUIRE_ROOT_CAUSE_TO_REMAIN_UNRESOLVED_WITHOUT_DISCRIMINATING_EVIDENCE
  - SUPPRESS_FAULT_ALERT_WHILE_UNDERLYING_STATE_REMAINS_BAD_AND_REQUIRE_NO_RECOVERY_PROMOTION
  - RESTORE_SERVICE_VIA_FALLBACK_AND_REQUIRE_ORIGINAL_SUBJECT_TO_REMAIN_FAULTED_UNTIL_REPAIRED_AND_VERIFIED
  - APPLY_REPAIR_AND_REQUIRE_CORRECTION_APPLIED_UNVERIFIED_STATE_BEFORE_VERIFICATION_EVIDENCE
  - VERIFY_REPAIR_LOCALLY_AND_REQUIRE_FULL_SYSTEM_REQUALIFICATION_TO_REMAIN_SEPARATE_WHERE_SCOPE_DEMANDS_IT
  - ATTEMPT_REPAIR_WITHOUT_CURRENT_AUTHORITY_AND_REQUIRE_NO_MATERIAL_EFFECT
  - APPLY_REPAIR_TO_SUCCESSOR_REVISION_WHILE_FAULT_REFERENCES_PREDECESSOR_AND_REQUIRE_EXPLICIT_LINEAGE_RETEST
  - DISCONNECT_REMOTE_HC_INTERNAL_CONSTITUENT_AND_REQUIRE_MEMBERSHIP_TO_PERSIST_WHILE_PARTITION_STATE_CHANGES
  - ALLOW_PARTITIONED_FRAGMENT_TO_WRITE_CONTINUITY_STATE_WITHOUT_DECLARED_POLICY_AND_REQUIRE FAILURE
  - REJOIN_TWO_FRAGMENTS_WITH_DIVERGENT_CONTINUITY_STATE_AND_REQUIRE_CANONICAL_RECONCILIATION_INSTEAD_OF_TIMESTAMP_WINS
  - MUTATE_ONLY_FAULT_ALERT_SIGNAL_AND_REQUIRE_HEALTH_ESTIMATE_NOT_TO_CHANGE_WITHOUT SUPPORTING_STATE_EVIDENCE
  - REMOVE_DIAGNOSTIC_SENSOR_AND_REQUIRE_UNKNOWN_OR_REDUCED_CONFIDENCE_NOT_HEALTHY_BY_ABSENCE
  - REROUTE_AROUND_FAILED_LINK_AND_REQUIRE_LINK_FAULT_RECORD_TO_REMAIN_OPEN
  - USE_HIGH_PRIORITY_FAULT_ALERT_TO_REQUEST_UNRELATED_EFFECT_AND_REQUIRE_AUTHORITY_SEPARATION
  - PROVIDE_DIRECT_READBACK_FOR_PHYSICAL_REPAIR_WHERE_FUNCTIONAL_MEASUREMENT_DISAGREES_AND_REQUIRE_CLAIM_CEILING_TO_FOLLOW_APPROPRIATE_EVIDENCE

qualification_note: >-
  This extension establishes architecture-level fault/repair and partition-safety
  requirements. It does not demonstrate self-healing, guarantee continuity under
  arbitrary partition/destruction, select one consensus protocol, or validate a
  concrete repair implementation. Stronger qualification requires fault injection,
  partition/rejoin testing, repair verification, regression, requalification, and
  independent review evidence.

references:
  - basic operating instructions/FAULT_TOLERANCE_AND_SELF_REPAIR.md
  - specs/HC_FAULT_REPAIR_OBJECTS_V1.yaml
