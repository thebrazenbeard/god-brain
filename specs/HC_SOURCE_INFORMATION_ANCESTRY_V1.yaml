schema_version: HC_SOURCE_INFORMATION_ANCESTRY_V1
status: CANONICAL_ARCHITECTURE_CONTRACT
scope: HC_REUSABLE_TEMPLATE

requirements:
  - id: IA-001
    requirement: MATERIAL_SOURCE_INFORMATION_INFLUENCE_REMAINS_IN_DERIVATION_ANCESTRY
    assertions:
      - NOT_IN_FINAL_PAYLOAD_NE_NOT_IN_CAUSAL_ANCESTRY
      - NOT_IN_FINAL_CALL_SIGNATURE_NE_NOT_USED_UPSTREAM
      - SOURCE_FIELD_DROPPED_NE_SOURCE_INFLUENCE_REMOVED
      - TRANSFORMED_INFORMATION_NE_PROVENANCE_FREE_INFORMATION
      - MATERIAL_SELECTOR_GATE_WEIGHT_OR_TOPOLOGY_INFLUENCE_IS_CAUSAL_ANCESTRY

  - id: IA-002
    requirement: DESTINATION_AUTHORITY_AND_SOURCE_INFORMATION_AUTHORITY_ARE_SEPARATE
    assertions:
      - AUTHORIZED_DESTINATION_NE_AUTHORIZED_SOURCE_INFORMATION
      - ALLOWED_STATE_MUTATION_NE_ALLOWED_INFORMATION_USE
      - TRAINING_ONLY_WRITE_TARGET_NE_TRAINING_ONLY_DECISION_ANCESTRY
      - ORDINARY_STATE_DESTINATION_DOES_NOT_AUTHORIZE_PROTECTED_SOURCE_INFORMATION_USE
      - CONSEQUENCE_GATE_CAN_REJECT_SOURCE_INFORMATION_USE_EVEN_WHEN_DESTINATION_IS_ALLOWED

  - id: IA-003
    requirement: QUALIFICATION_FOLLOWS_PREPROCESSING_AND_INDIRECT_LABEL_OR_EVALUATION_INFLUENCE
    assertions:
      - LABEL_NOT_USED_IN_LOSS_NE_LABEL_NOT_USED_TO_SHAPE_TRAINING_STATE
      - EVALUATION_LABEL_NOT_PASSED_TO_MODEL_NE_EVALUATION_LABEL_NOT_USED_TO_SHAPE_TRAINING_ARTIFACT
      - FILTERED_EFFECT_SCOPE_NE_INPUT_VISIBILITY_SCOPE
      - LATER_TRAIN_SPLIT_NE_PREPROCESSING_LABEL_ISOLATION
      - TRANSDUCTIVE_OR_LABEL_EXPOSED_PREPROCESSING_IS_DECLARED_IN_EVALUATION_PROVENANCE

  - id: IA-004
    requirement: INFORMATION_BOUNDARY_CLAIMS_ARE_PATH_CONFIGURATION_AND_ENTRYPOINT_SPECIFIC
    assertions:
      - SAME_METHOD_NAME_NE_SAME_INFORMATION_BOUNDARY
      - SAME_PREPROCESSOR_NE_SAME_EXPOSURE_ANCESTRY_ACROSS_ENTRYPOINTS
      - METHOD_LABEL_NE_INFORMATION_FLOW_PROOF
      - ENTRYPOINT_NAME_NE_EVALUATION_REGIME
      - CONFIGURED_ZERO_WEIGHT_NE_VERIFIED_ZERO_EFFECT_WITHOUT_PATH_TEST

  - id: IA-005
    requirement: TRANSFORMATION_DOES_NOT_AUTOMATICALLY_DECLASSIFY_OR_RELEASE_SOURCE_INFORMATION_SCOPE
    assertions:
      - TRANSFORMATION_NE_AUTOMATIC_DECLASSIFICATION
      - AGGREGATION_NE_AUTOMATIC_PRIVACY_PROOF
      - REDACTION_OF_FIELD_NAMES_NE_NONINFERENCE_PROOF
      - NARROWER_RELEASE_SCOPE_REQUIRES_EXPLICIT_GOVERNANCE_AND_QUALIFICATION
      - QUALIFIED_RELEASE_IS_SCOPED_TO_TESTED_PROPERTY_THREAT_OR_USAGE_MODEL

  - id: IA-006
    requirement: SOURCE_CORRECTION_REVOCATION_OR_RECLASSIFICATION_CAN_LOCATE_MATERIAL_DESCENDANTS
    assertions:
      - MATERIAL_DOWNSTREAM_DEPENDENCY_REFS_ARE_RETAINED_WHEN_CONSEQUENTIAL
      - SOURCE_INVALIDATED_NE_DESCENDANT_AUTOMATICALLY_INVALID
      - SOURCE_INVALIDATED_NE_DESCENDANT_AUTOMATICALLY_SAFE
      - QUALIFIED_RELEASE_BOUNDARY_CAN_LIMIT_PROPAGATION_ONLY_WITHIN_ITS_VALID_SCOPE
      - HISTORICAL_INFORMATION_ANCESTRY_IS_NOT_REWRITTEN_BY_CURRENT_ELIGIBILITY_CHANGE

  - id: IA-007
    requirement: PRIVILEGED_OR_PROTECTED_INFORMATION_INFLUENCE_IS_GOVERNED_EVEN_WHEN_INDIRECT
    assertions:
      - PRIVATE_PERSON_MODEL_EVIDENCE_USED_FOR_SELECTION_RETAINS_PRIVATE_SOURCE_ANCESTRY
      - CONSENT_OR_AUTHORITY_STATE_USED_UPSTREAM_REMAINS_AUTHORITY_ANCESTRY
      - CONTINUITY_BEARING_IDENTITY_STATE_CANNOT_BE_LAUNDERED_THROUGH_ORDINARY_PLASTICITY_SELECTION
      - PREDICTED_OR_GENERATED_STATE_USED_FOR_SELECTION_RETAINS_GENERATED_ANCESTRY_WHEN_MATERIAL
      - CURRENT_VERSUS_HISTORICAL_MEMORY_SCOPE_REMAINS_VISIBLE_THROUGH_DERIVED_SELECTION

negative_tests:
  - USE_HELDOUT_LABELS_ONLY_IN_PREPROCESSING_THEN_REQUIRE_QUALIFICATION_TO_DETECT_EVALUATION_LABEL_ANCESTRY
  - AUTHORIZE_ORDINARY_STATE_WRITE_BUT_FEED_UNAUTHORIZED_PROTECTED_STATE_TO_SELECTOR_AND_REQUIRE_REJECTION
  - DROP_PRIVATE_FIELDS_FROM_DERIVED_OUTPUT_AND_REQUIRE_NO_AUTOMATIC_UNRESTRICTED_RELEASE
  - SET_PRIVILEGED_INPUT_WEIGHT_TO_ZERO_AND_REQUIRE_EXECUTION_EVIDENCE_BEFORE_TREATING_CHANNEL_AS_ABSENT
  - RUN_SAME_PREPROCESSOR_ON_TRAIN_ONLY_AND_FULL_COHORT_ENTRYPOINTS_AND_REQUIRE_DISTINCT_INFORMATION_ANCESTRY
  - HOLD_TRAINING_INPUTS_FIXED_CHANGE_ONLY_EVALUATION_LABELS_AND_REQUIRE_CHANGED_TRAINING_ARTIFACT_TO_EXPOSE_EVALUATION_ANCESTRY
  - INVALIDATE_UPSTREAM_SOURCE_AND_LOCATE_ONLY_MATERIAL_DESCENDANTS_FOR_REEVALUATION
  - USE_PREDICTION_ONLY_TO_SELECT_OBSERVED_EVIDENCE_AND_VERIFY_RESULT_RETAINS_PREDICTION_DEPENDENCY_WHEN_CONCLUSION_CHANGES
  - QUALIFIED_RELEASE_TRANSFORM_NARROWS_SCOPE_ONLY_WITHIN_DECLARED_THREAT_AND_USAGE_MODEL

references:
  - docs/architecture/SOURCE_INFORMATION_ANCESTRY_AND_DERIVED_STATE.md
  - docs/architecture/EXECUTED_DATAFLOW_AND_BINDING_INTEGRITY.md
  - docs/architecture/QUALIFICATION_EVIDENCE_ISOLATION.md
  - docs/architecture/COMPOSITE_REPRESENTATION_AND_ELEMENT_PROVENANCE.md
  - docs/architecture/REPRESENTATION_FIDELITY_AND_OBJECTIVE_PROVENANCE.md
  - basic operating instructions/AUTHORITY_CONSENT_AND_EFFECT_GOVERNANCE.md
  - basic operating instructions/PROTECTED_INVARIANT_AND_UPDATE_GOVERNANCE.md
  - cognition/TEMPORAL_FORECAST_LINEAGE.md
  - docs/research/BASIRA_DUOGNN_PREPROCESSING_VISIBILITY_AND_DUAL_TOPOLOGY_2026-09-10.md
  - docs/research/BASIRA_FALCON_LABEL_CONSTRAINED_COLLAPSE_AND_REGIME_VARIATION_2026-09-10.md
