schema_version: HC_RUNTIME_COMPONENT_CUSTODY_V1
status: CANONICAL_ARCHITECTURE_CONTRACT
scope: HC_REUSABLE_TEMPLATE

requirements:
  - id: RC-001
    requirement: MATERIAL_STATEFUL_COMPONENTS_ARE_MANAGED_RUNTIME_MEMBERS
    assertions:
      - DECLARED_COMPONENT_NE_REGISTERED_RUNTIME_COMPONENT
      - CALLED_IN_FORWARD_NE_MANAGED_BY_LIFECYCLE
      - COMPUTES_OUTPUT_NE_STATE_IS_DURABLY_CUSTODIED
      - DEVICE_REACHABLE_NE_HC_MEMBER
      - RUNTIME_MEMBER_NE_EFFECT_AUTHORITY

  - id: RC-002
    requirement: MUTABLE_CAUSAL_STATE_HAS_EXPLICIT_UPDATE_AND_DURABILITY_CUSTODY
    assertions:
      - LEARNABLE_PARAMETER_EXISTS_NE_PLASTICITY_PATH_CAN_REACH_PARAMETER
      - OBJECT_REACHABLE_NE_CHECKPOINTED
      - CHECKPOINTED_NE_RESTORED_AND_REQUALIFIED
      - MATERIAL_MUTABLE_STATE_HAS_UPDATE_OWNER
      - MATERIAL_DURABLE_STATE_HAS_DURABILITY_PATH
      - MATERIAL_STATE_HAS_RECOVERY_BEHAVIOR
      - MATERIAL_STATE_HAS_COMPATIBILITY_VERSION_WHEN_VERSION_SKEW_IS_POSSIBLE

  - id: RC-003
    requirement: REGISTRATION_PLANES_REMAIN_DISTINCT
    assertions:
      - ROUTED_COMPONENT_NE_CHECKPOINTED_COMPONENT
      - CHECKPOINTED_COMPONENT_NE_HEALTH_MONITORED_COMPONENT
      - HEALTH_MONITORED_COMPONENT_NE_UPDATE_AUTHORIZED_COMPONENT
      - SUBSTRATE_ENUMERATION_NE_COGNITIVE_OWNERSHIP
      - BODY_INTERFACE_REGISTRATION_NE_HC_INTERNAL_MEMBERSHIP

  - id: RC-004
    requirement: DISTRIBUTED_HC_CONSTITUENTS_HAVE_COMPLETE_STATE_CUSTODY
    assertions:
      - EVERY_ESSENTIAL_DISTRIBUTED_CONSTITUENT_IS_ENUMERATED
      - DISTRIBUTED_STATE_VERSION_COMPATIBILITY_IS_CHECKED
      - MISSING_CONSTITUENT_IS_EXPLICIT_DEGRADATION_OR_FAULT
      - NO_UNTRACKED_SOLE_COPY_OF_ESSENTIAL_LEARNED_STATE_EXISTS_IN_PERIPHERAL_ACCELERATOR_OR_SERVICE
      - DISTRIBUTED_RECOVERY_OWNERSHIP_IS_EXPLICIT

  - id: RC-005
    requirement: DYNAMIC_COMPONENTS_CROSS_ADMISSION_BEFORE_DURABLE_OR_ESSENTIAL_PROMOTION
    assertions:
      - TEMPORARY_COMPONENT_NE_DURABLE_RUNTIME_MEMBER
      - TEMPORARY_ROUTE_NE_DURABLE_AUTHORITY
      - DYNAMIC_COMPONENT_WITH_DURABLE_LEARNED_STATE_REQUIRES_ADMISSION
      - DYNAMIC_COMPONENT_BECOMING_ESSENTIAL_REQUIRES_MANAGED_MEMBERSHIP

  - id: RC-006
    requirement: CONFIGURABILITY_CLAIMS_ARE_TESTED_BEYOND_NOMINAL_SHAPE
    assertions:
      - PARAMETERIZED_INTERFACE_NE_DIMENSION_AGNOSTIC_IMPLEMENTATION
      - NOMINAL_SIZE_PASS_NE_GENERAL_SIZE_CONFORMANCE
      - FIXED_SIZE_ASSUMPTIONS_ARE_SURFACED_AS_SCOPE_LIMITS_OR_FAILURES

negative_tests:
  - CAUSAL_CHILD_PARTICIPATES_IN_INFERENCE_BUT_IS_OMITTED_FROM_PARENT_CHECKPOINT_ENUMERATION
  - PARENT_SUBSTRATE_MOVE_LEAVES_CLAIMED_CHILD_COMPONENT_ON_OLD_SUBSTRATE_WITHOUT_EXPLICIT_FAILURE
  - UNREGISTERED_CAUSAL_PARAMETER_IS_NOT_UPDATED_BY_PARENT_PLASTICITY_OR_OPTIMIZER_PATH
  - CHECKPOINT_RESTORE_OMITS_CAUSAL_CHILD_STATE_AND_MUST_NOT_SILENTLY_PASS
  - HEALTH_ENUMERATION_OMITS_ESSENTIAL_STATEFUL_COMPONENT_AND_MUST_FAIL_CONFORMANCE
  - DISTRIBUTED_CONSTITUENT_LOSS_DOES_NOT_SILENTLY_USE_STALE_UNTRACKED_STATE
  - DYNAMIC_COMPONENT_ACQUIRES_DURABLE_INFLUENCE_WITHOUT_ADMISSION_AND_IS_REJECTED
  - OFF_NOMINAL_DIMENSION_EXPOSES_HARD_CODED_TOPOLOGY_OR_MASK_ASSUMPTION

references:
  - docs/architecture/RUNTIME_COMPONENT_REGISTRATION_AND_STATE_CUSTODY.md
  - docs/architecture/COGNITIVE_ORGAN_BOUNDARY.md
  - docs/architecture/PHYSICAL_ORGAN_MEMBERSHIP.md
  - basic operating instructions/SUBSYSTEM_LIFECYCLE_CONTRACT.md
  - basic operating instructions/BOOTSTRAP_RECOVERY_AND_SAFE_DEGRADATION.md
  - basic operating instructions/PROTECTED_INVARIANT_AND_UPDATE_GOVERNANCE.md
  - docs/runtime/PLASTICITY_AND_STATE_GOVERNANCE.md
  - docs/research/BASIRA_GSRNET_REGISTERED_RUNTIME_AND_SUPERRESOLUTION_2026-09-09.md
