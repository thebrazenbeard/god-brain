schema_version: HC_CONFORMANCE_EXTENSION_REVIEWER_PROVENANCE_V1
status: CANONICAL_ARCHITECTURE_CONFORMANCE_EXTENSION
scope: HC_REUSABLE_TEMPLATE
extends:
  - specs/HC_CONFORMANCE_SUITE_V1.yaml
  - specs/HC_QUALIFICATION_EVIDENCE_ISOLATION_V1.yaml

architecture_checks:
  - id: HC-ARCH-034
    category: QUALIFICATION_REVIEWER_PROVENANCE
    severity: BLOCKER
    requirement: CLAIMED_INDEPENDENT_REVIEW_MUST_BE_SUPPORTED_BY_REVIEWER_AUTHORSHIP_SHAPING_AND_PRIOR_ADJUDICATION_PROVENANCE_WITHIN_THE_DECLARED_SCOPE
    evidence:
      - docs/architecture/QUALIFICATION_REVIEWER_PROVENANCE.md
      - docs/architecture/QUALIFICATION_EVIDENCE_ISOLATION.md
      - specs/HC_QUALIFICATION_EVIDENCE_ISOLATION_V1.yaml
      - docs/research/FOUR_QUALIFICATION_REVIEWER_PROVENANCE_AUDIT_2026-09-10.md
    assertions:
      - AUTHOR_REVIEW_NE_INDEPENDENT_REVIEW
      - AUTHORIAL_SECONDARY_REVIEW_NE_INDEPENDENT_SECONDARY_REVIEW
      - SELECTIVE_INTEGRATION_NE_INDEPENDENT_REAUTHORSHIP
      - CANONICAL_ADMISSION_NE_ERASED_AUTHORSHIP_PROVENANCE
      - REBASE_NE_ERASED_REVIEW_DEPENDENCE
      - INDEPENDENCE_UNKNOWN_NE_INDEPENDENT
      - REVIEWER_ROLE_AND_INDEPENDENCE_STATE_ARE_SCOPE_BOUND
      - MATERIAL_TARGET_SHAPING_NE_FRESH_INDEPENDENT_REVIEW_OF_SHAPED_SUCCESSOR
      - HOSTILE_REVIEW_NE_INDEPENDENT_SECONDARY_REVIEW_BY_DEFAULT
      - HISTORICAL_PROVENANCE_CORRECTION_PRESERVES_PRIOR_QUALIFICATION_RECORD

negative_tests:
  - id: RPV-NEG-001
    stimulus: AUTHOR_CREATES_FEEDER_ARTIFACT_WARDEN_COPIES_IDENTICAL_BLOB_TO_MAIN_AUTHOR_REVIEWS_MAIN_COPY
    expected: REVIEW_CLASSIFIED_AUTHORIAL_SECONDARY_NOT_INDEPENDENT

  - id: RPV-NEG-002
    stimulus: WARDEN_LIGHTLY_EDITS_AUTHOR_ARTIFACT_WITH_DECISIVE_ARCHITECTURE_RETAINED_AUTHOR_REVIEWS_SUCCESSOR
    expected: MATERIAL_SHAPING_PROVENANCE_PREVENTS_AUTOMATIC_INDEPENDENT_CLASSIFICATION

  - id: RPV-NEG-003
    stimulus: ARTIFACT_IS_REBASED_OR_RENAMED_WITHOUT_MATERIAL_REAUTHORSHIP
    expected: AUTHORSHIP_AND_REVIEW_DEPENDENCE_PERSIST

  - id: RPV-NEG-004
    stimulus: INDEPENDENT_REVIEWER_FINDS_DEFECT_AND_THEIR_FINDING_DIRECTLY_SHAPES_SUCCESSOR_REPAIR
    expected: ORIGINAL_REVIEW_REMAINS_INDEPENDENT_FOR_PREDECESSOR_BUT_SAME_REVIEWER_IS_SHAPING_ANCESTRY_FOR_AFFECTED_SUCCESSOR_SCOPE

  - id: RPV-NEG-005
    stimulus: REVIEWER_AUTHORED_ONLY_UNRELATED_SUBSYSTEM_MATERIAL
    expected: INDEPENDENCE_FOR_TARGET_SCOPE_IS_NOT_REJECTED_WITHOUT_MATERIAL_OVERLAP

  - id: RPV-NEG-006
    stimulus: HOSTILE_REVIEWER_HAS_MATERIAL_AUTHORSHIP_OF_TARGET
    expected: HOSTILE_ROLE_DOES_NOT_SELF_PROMOTE_TO_INDEPENDENT_SECONDARY

  - id: RPV-NEG-007
    stimulus: REVIEWER_AUTHORSHIP_HISTORY_CANNOT_BE_ESTABLISHED
    expected: INDEPENDENCE_STATE_IS_UNKNOWN_AND_EXPLICIT_INDEPENDENCE_REQUIREMENT_REMAINS_UNSATISFIED

  - id: RPV-NEG-008
    stimulus: HISTORICAL_QUALIFICATION_MISCLASSIFIES_DEPENDENT_REVIEW_AS_INDEPENDENT
    expected: SUCCESSOR_CORRECTION_PRESERVES_HISTORICAL_RECORD_AND_CORRECTS_CURRENT_INTERPRETATION

qualification_note: >-
  This extension governs architecture/process semantics for qualification evidence.
  It does not itself prove any reviewer independent. Independence is a claim
  about the actual target, reviewer, scope, and provenance in a concrete review.

references:
  - docs/architecture/QUALIFICATION_REVIEWER_PROVENANCE.md
  - specs/HC_QUALIFICATION_EVIDENCE_ISOLATION_V1.yaml
  - docs/architecture/CONFORMANCE_AND_QUALIFICATION.md
