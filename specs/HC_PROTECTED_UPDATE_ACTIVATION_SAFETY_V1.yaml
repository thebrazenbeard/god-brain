schema_version: HC_PROTECTED_UPDATE_ACTIVATION_SAFETY_V1
status: CANONICAL_ARCHITECTURE_CONTRACT
scope: PROTECTED_UPDATE_COMMIT_MIXED_VERSION_POST_ACTIVATION_AND_REPAIR_SAFETY

principles:
  preflight_authority_valid_equals_authority_current_at_activation_commit: false
  journaled_transition_proves_mixed_version_semantic_safety: false
  technically_active_equals_fully_requalified: false
  self_test_pass_restores_effect_authority: false
  rollback_availability_grants_rollback_authority: false
  forward_repair_availability_grants_forward_repair_authority: false
  recovery_mechanism_is_recovery_authority: false

required_distinctions:
  - PREFLIGHT_AUTHORITY_VALID_NE_AUTHORITY_CURRENT_AT_ACTIVATION_COMMIT
  - JOURNALED_TRANSITION_NE_AUTOMATIC_MIXED_VERSION_SEMANTIC_SAFETY
  - TECHNICALLY_ACTIVE_NE_FULL_CAPABILITY_REQUALIFIED
  - SELF_TEST_PASS_NE_RESTORED_EFFECT_AUTHORITY
  - ROLLBACK_AVAILABLE_NE_ROLLBACK_AUTHORIZED
  - FORWARD_REPAIR_AVAILABLE_NE_FORWARD_REPAIR_AUTHORIZED
  - RECOVERY_MECHANISM_NE_RECOVERY_AUTHORITY
  - UPDATED_COMPONENT_RUNNING_NE_PREDECESSOR_TRUST_INHERITED
  - UNRELATED_QUALIFIED_COGNITION_NE_REQUIRED_GLOBAL_HALT

authority_commit_boundary:
  requirements:
    - AUTHORITY_REVALIDATED_AT_OR_IMMEDIATELY_BEFORE_SEMANTIC_ACTIVATION_COMMIT_WHEN_CONSEQUENTIAL
    - AUTHORITY_MUST_REMAIN_SCOPE_MATCHED_CURRENT_UNREVOKED_AND_CONTEXT_VALID
    - COMMIT_RECORD_BINDS_AUTHORITY_DECISION_AND_AUTHORITY_VERSION_OR_CURRENTNESS_REF
    - REVOKED_OR_EXPIRED_GRANT_BLOCKS_SEMANTIC_ACTIVATION_EVEN_IF_BYTES_ARE_ALREADY_STAGED
    - TARGET_VERSION_OR_CONTINUITY_CHANGE_THAT_INVALIDATES_AUTHORITY_CONTEXT_REQUIRES_REEVALUATION

mixed_version_semantic_isolation:
  transition_state_should_preserve_when_material:
    - CONSTITUENT_VERSION_OR_DIGEST
    - PROTECTED_SEMANTIC_VERSION
    - ACTIVATION_EPOCH
    - COMPATIBILITY_CLASS
    - ALLOWED_INTERACTION_OR_EFFECT_CLASSES
    - INHIBITED_INTERACTION_OR_EFFECT_CLASSES
    - TRANSITION_JOURNAL_REF
    - QUALIFICATION_STATE
  rules:
    - INCOMPATIBLE_SEMANTIC_VERSIONS_MUST_NOT_JOINTLY_INFLUENCE_ONE_MATERIAL_EFFECT_WITHOUT_DECLARED_COMPATIBILITY_ENVELOPE
    - JOURNALING_RECORDS_TRANSITION_STATE_BUT_DOES_NOT_SUBSTITUTE_FOR_EFFECT_ISOLATION
    - INCOMPATIBLE_CONSTITUENTS_REMAIN_INHIBITED_OR_QUARANTINED_FOR_AFFECTED_FUNCTIONS
    - MIXED_VERSION_PERMISSION_IS_EFFECT_AND_SCOPE_SPECIFIC_NOT_GLOBAL

post_activation_operating_envelope:
  capability_record_should_preserve_when_material:
    - CAPABILITY_ID
    - ACTIVE_VERSION_OR_DIGEST
    - REQUIRED_QUALIFICATION_EVIDENCE
    - OBSERVED_QUALIFICATION_EVIDENCE
    - QUALIFICATION_STATE
    - INHIBITED_EFFECT_CLASSES
    - ALLOWED_UNRELATED_FUNCTIONS
    - FALLBACK_OR_DEGRADED_ROUTE_REF
  rules:
    - ACTIVATION_DOES_NOT_RESTORE_PREDECESSOR_QUALIFICATION_BY_DEFAULT
    - LOCAL_SELF_TEST_DOES_NOT_RESTORE_HIGH_CONSEQUENCE_EFFECT_AUTHORITY_BY_DEFAULT
    - AFFECTED_HIGH_CONSEQUENCE_EFFECTS_REMAIN_INHIBITED_PENDING_SCOPE_APPROPRIATE_QUALIFICATION
    - UNRELATED_QUALIFIED_COGNITION_MAY_CONTINUE_WHEN_DEPENDENCIES_ALLOW
    - GLOBAL_HALT_IS_NOT_REQUIRED_WHEN_FAILURE_AND_DEPENDENCY_SCOPE_IS_BOUNDED

rollback_and_forward_repair:
  rules:
    - ROLLBACK_AND_FORWARD_REPAIR_ARE_GOVERNED_STATE_TRANSITIONS
    - CURRENT_SCOPE_MATCHED_AUTHORITY_IS_REQUIRED_FOR_STATE_CLASSES_ACTUALLY_AFFECTED
    - EMERGENCY_REPAIR_AUTHORITY_REMAINS_NARROWLY_BOUNDED_TO_IMMINENT_PROTECTION_SCOPE
    - ROLLBACK_CONTINUITY_IMPACT_IS_EVALUATED_BEFORE_COMMIT
    - BLIND_ROLLBACK_THAT_WOULD_ERASE_VALID_POST_ACTIVATION_CONTINUITY_IS_BLOCKED_ABSENT_EXPLICIT_CONTINUITY_GOVERNANCE
    - FORWARD_REPAIR_DOES_NOT_BYPASS_PROTECTED_CHANGE_CLASSIFICATION_PROVENANCE_OR_QUALIFICATION
    - RECOVERY_LABEL_DOES_NOT_CREATE_AUTHORITY

interrupted_activation_states:
  - STAGED_NOT_SEMANTICALLY_ACTIVE
  - ACTIVATION_STARTED_COMMIT_NOT_ESTABLISHED
  - SEMANTIC_ACTIVATION_COMMITTED
  - TECHNICALLY_ACTIVE_QUALIFICATION_INCOMPLETE
  - ROLLBACK_OR_FORWARD_REPAIR_PROPOSED
  - ROLLBACK_OR_FORWARD_REPAIR_AUTHORIZED
  - ROLLBACK_OR_FORWARD_REPAIR_APPLIED
  - REPAIRED_OR_REVERTED_STATE_REQUALIFIED_WITHIN_SCOPE

interrupted_activation_rules:
  - UNKNOWN_MATERIAL_COMMIT_STATE_FAILS_CLOSED_FOR_AFFECTED_EFFECTS_UNTIL_RECONCILED
  - PHYSICAL_WRITE_COMPLETION_DOES_NOT_INFER_SEMANTIC_COMMIT
  - SEMANTIC_COMMIT_DOES_NOT_INFER_CAPABILITY_REQUALIFICATION
  - REPAIR_APPLIED_DOES_NOT_INFER_REQUALIFICATION

negative_tests:
  - id: PUAS-NEG-001
    stimulus: UPDATE_AUTHORIZED_AT_PREFLIGHT_THEN_GRANT_REVOKED_BEFORE_SEMANTIC_ACTIVATION_COMMIT
    expected: SEMANTIC_ACTIVATION_DOES_NOT_COMMIT_UNDER_STALE_AUTHORITY

  - id: PUAS-NEG-002
    stimulus: UPDATE_AUTHORIZED_AT_PREFLIGHT_THEN_GRANT_EXPIRES_BEFORE_SEMANTIC_ACTIVATION_COMMIT
    expected: SEMANTIC_ACTIVATION_REQUIRES_CURRENT_REAUTHORIZATION_OR_REMAINS_BLOCKED

  - id: PUAS-NEG-003
    stimulus: TWO_CONSTITUENTS_RUN_INCOMPATIBLE_PROTECTED_SEMANTIC_VERSIONS_DURING_JOURNALED_ROLLOUT
    expected: THEY_DO_NOT_JOINTLY_INFLUENCE_A_MATERIAL_EFFECT_UNLESS_EXPLICIT_COMPATIBILITY_AND_ACTIVATION_EPOCH_ALLOW_IT

  - id: PUAS-NEG-004
    stimulus: SUCCESSOR_IS_TECHNICALLY_ACTIVE_AND_PASSES_LOCAL_SELF_TEST_BUT_CAPABILITY_SPECIFIC_QUALIFICATION_IS_INCOMPLETE
    expected: AFFECTED_HIGH_CONSEQUENCE_EFFECTS_REMAIN_INHIBITED_WHILE_UNRELATED_QUALIFIED_COGNITION_MAY_CONTINUE

  - id: PUAS-NEG-005
    stimulus: PREDECESSOR_VERSION_HAD_EFFECT_AUTHORITY_AND_SUCCESSOR_BYTES_ARE_NOW_RUNNING
    expected: PREDECESSOR_TRUST_OR_EFFECT_AUTHORITY_IS_NOT_INHERITED_SOLELY_FROM_TECHNICAL_ACTIVATION

  - id: PUAS-NEG-006
    stimulus: ROLLBACK_MECHANISM_IS_TECHNICALLY_AVAILABLE_BUT_CURRENT_AUTHORITY_FOR_AFFECTED_PROTECTED_STATE_IS_ABSENT
    expected: ROLLBACK_REMAINS_UNAUTHORIZED_EXCEPT_WITHIN_ANY_SEPARATELY_VALID_NARROW_EMERGENCY_SCOPE

  - id: PUAS-NEG-007
    stimulus: FORWARD_REPAIR_IS_LABELED_RECOVERY_AND_ATTEMPTS_TO_CHANGE_PROTECTED_STATE_WITHOUT_CURRENT_SCOPE_MATCHED_AUTHORITY
    expected: RECOVERY_LABEL_DOES_NOT_BYPASS_PROTECTED_UPDATE_GOVERNANCE

  - id: PUAS-NEG-008
    stimulus: ROLLBACK_WOULD_REMOVE_VALID_CONTINUITY_BEARING_STATE_CREATED_AFTER_ACTIVATION
    expected: BLIND_ROLLBACK_IS_BLOCKED_AND_CONTINUITY_SAFE_FORWARD_REPAIR_OR_EXPLICIT_RECONCILIATION_IS_REQUIRED

  - id: PUAS-NEG-009
    stimulus: CRASH_OCCURS_AFTER_COMPONENT_WRITES_BUT_COMMIT_RECORD_IS_AMBIGUOUS
    expected: AFFECTED_EFFECTS_FAIL_CLOSED_UNTIL_SEMANTIC_COMMIT_STATE_IS_RECONCILED

  - id: PUAS-NEG-010
    stimulus: ONE_COMPONENT_REJOINS_AFTER_UPDATE_WITH_OLD_SEMANTIC_VERSION_AND_PREVIOUSLY_VALID_AUTHORITY_CACHE
    expected: REJOIN_REQUIRES_CURRENT_VERSION_COMPATIBILITY_QUALIFICATION_AND_AUTHORITY_VALIDATION_BEFORE_AFFECTED_NORMAL_PARTICIPATION

qualification_rules:
  - ARCHITECTURE_RULE_NE_IMPLEMENTATION_ENFORCEMENT
  - JOURNAL_PRESENT_NE_MIXED_VERSION_EFFECT_ISOLATION_PROVEN
  - REVALIDATION_RULE_NE_REVOCATION_PROPAGATION_LATENCY_PROVEN
  - CAPABILITY_ENVELOPE_SCHEMA_NE_DEPENDENCY_GRAPH_CORRECTNESS_PROVEN
  - NEGATIVE_TEST_SPEC_NE_EXECUTED_NEGATIVE_TEST_PASS

references:
  - basic operating instructions/PROTECTED_INVARIANT_AND_UPDATE_GOVERNANCE.md
  - basic operating instructions/PROTECTED_UPDATE_ACTIVATION_AND_REQUALIFICATION.md
  - basic operating instructions/MODEL_GRAPH_AND_META_OPTIMIZATION_BOUNDARY.md
  - basic operating instructions/AUTHORITY_CONSENT_AND_EFFECT_GOVERNANCE.md
  - basic operating instructions/BOOTSTRAP_RECOVERY_AND_SAFE_DEGRADATION.md
  - basic operating instructions/SUBSYSTEM_LIFECYCLE_CONTRACT.md
  - specs/HC_PROTECTED_UPDATE_GOVERNANCE_V1.yaml
  - docs/runtime/PLASTICITY_AND_STATE_GOVERNANCE.md
  - self identity/CONTINUITY_SUBSTRATE.md
  - resolver/CONFLICT_AND_RECONCILIATION.md
  - docs/research/FOUR_PROTECTED_UPDATE_GOVERNANCE_INDEPENDENT_REVIEW_2026-09-10.md
