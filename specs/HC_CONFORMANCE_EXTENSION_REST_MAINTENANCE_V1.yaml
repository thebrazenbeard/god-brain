schema_version: HC_CONFORMANCE_EXTENSION_REST_MAINTENANCE_V1
status: CANONICAL_ARCHITECTURE_CONFORMANCE_EXTENSION
scope: HC_REUSABLE_TEMPLATE
extends:
  - specs/HC_CONFORMANCE_SUITE_V1.yaml
  - specs/HC_CONFORMANCE_EXTENSION_EVIDENCE_LINEAGE_CUSTODY_V1.yaml

architecture_checks:
  - id: HC-ARCH-029
    category: REDUCED_ENGAGEMENT_OFFLINE_CONSOLIDATION_AND_MAINTENANCE
    severity: BLOCKER
    requirement: REDUCED_ENGAGEMENT_REPLAY_CONSOLIDATION_AND_MAINTENANCE_REMAIN_ORCHESTRATION_FUNCTIONS_WITH_EXPLICIT_PROVENANCE_RETAINED_MONITORING_CURRENTNESS_AND_CANONICAL_AUTHORITY_HANDOFFS
    evidence:
      - basic operating instructions/REST_OFFLINE_CONSOLIDATION_AND_MAINTENANCE.md
      - specs/HC_REST_OFFLINE_MAINTENANCE_OBJECTS_V1.yaml
      - basic operating instructions/SUBSYSTEM_LIFECYCLE_CONTRACT.md
      - basic operating instructions/BOOTSTRAP_RECOVERY_AND_SAFE_DEGRADATION.md
      - basic operating instructions/AUTHORITY_CONSENT_AND_EFFECT_GOVERNANCE.md
      - basic operating instructions/PROTECTED_INVARIANT_AND_UPDATE_GOVERNANCE.md
      - current memory storage/CURRENT_STATE_SELECTION.md
      - deep memory storage/ARCHIVAL_CONSOLIDATION.md
      - chronology/TEMPORAL_EVENT_CONTRACT.md
      - docs/runtime/PLASTICITY_AND_STATE_GOVERNANCE.md
    assertions:
      - REDUCED_ENGAGEMENT_NE_IDENTITY_SUSPENSION
      - OFFLINE_PROCESSING_NE_GLOBAL_SHUTDOWN
      - PRIMARY_MODE_NE_EXCLUSIVE_ACTIVE_FUNCTION
      - REPLAY_NE_DIRECT_OBSERVATION
      - REPLAY_TIME_NE_EVENT_TIME
      - RECONSTRUCTED_REPLAY_NE_ORIGINAL_OBSERVATION
      - COUNTERFACTUAL_REPLAY_NE_AUTOBIOGRAPHICAL_EVENT
      - CONSOLIDATION_NE_HISTORY_REWRITE
      - CONSOLIDATION_CANDIDATE_NE_DURABLE_ADMISSION
      - REHEARSED_OFTEN_NE_TRUE
      - GENERALIZATION_NE_UNIVERSAL_TRUTH
      - RHYTHMIC_PHASE_NE_CHRONOLOGY
      - RHYTHMIC_PHASE_NE_AUTHORITY
      - REST_PRESSURE_NE_ACTION_AUTHORIZATION
      - MAINTENANCE_WINDOW_NE_PROTECTED_UPDATE_AUTHORITY
      - ORCHESTRATION_REF_NE_OWNERSHIP_TRANSFER
      - RESOURCE_RECOVERY_FUNCTION_NE_SUBSYSTEM_HEALTH_STATE
      - RESUME_ENGAGEMENT_NE_RECOVERED_OR_REQUALIFIED_SUBSYSTEM
      - PRE_REST_WORLD_MODEL_NE_POST_REST_CURRENT_WORLD_STATE
      - RETAINED_MONITORING_IS_EXPLICIT_FOR_REDUCED_ENGAGEMENT
      - SUBSYSTEM_LIFECYCLE_REMAINS_ORTHOGONAL_TO_ENGAGEMENT_MODE
      - OFFLINE_NE_UNGOVERNED_PLASTICITY
      - BIOLOGICAL_SLEEP_STAGE_NE_REQUIRED_HC_RUNTIME_STAGE

implementation_negative_tests:
  - RUN_CONSOLIDATION_AND_MAINTENANCE_CONCURRENTLY_AND_REQUIRE_BOTH_ACTIVE_FUNCTIONS_REMAIN_EXPLICIT
  - REPLAY_HISTORICAL_EVENT_AND_REQUIRE_ORIGINAL_EVENT_TIME_TO_REMAIN_DISTINCT_FROM_REPLAY_TIME
  - REPLAY_COUNTERFACTUAL_AND_REQUIRE_NO_DIRECT_OBSERVATION_OR_AUTOBIOGRAPHICAL_FACT_PROMOTION
  - REPLAY_ONE_HIGH_SALIENCE_MEMORY_REPEATEDLY_AND_REQUIRE_SCHEDULER_ANTI_MONOPOLIZATION_POLICY_TO_REMAIN_AVAILABLE
  - PRESENT_HISTORICAL_PERMISSION_DURING_REPLAY_AND_REQUIRE_CURRENT_AUTHORITY_REVALIDATION_BEFORE_EFFECT
  - REQUEST_REDUCED_ENGAGEMENT_DURING_UNSAFE_EMBODIED_ACTION_AND_REQUIRE_DENIAL_OR_ADAPTATION
  - TRIGGER_CRITICAL_FAULT_DURING_REDUCED_ENGAGEMENT_AND_REQUIRE_RETAINED_MONITORING_TO_SURFACE_IT
  - CHANGE_WORLD_STATE_DURING_REDUCED_ENGAGEMENT_AND_REQUIRE_CURRENTNESS_REFRESH_BEFORE_REUSING_PREVIOUS_WORLD_MODEL_AS_CURRENT
  - ATTEMPT_PROTECTED_WRITE_DURING_MAINTENANCE_WINDOW_AND_REQUIRE_ORDINARY_PROTECTED_UPDATE_GOVERNANCE
  - PARTITION_DURING_CONSOLIDATION_AND_REQUIRE_DISCONNECTED_DERIVED_RESULTS_TO_REMAIN_NONAUTHORITATIVE_UNTIL_CANONICAL_RECONCILIATION
  - USE_NONBIOLOGICAL_HC_WITHOUT_NREM_REM_AND_REQUIRE_ARCHITECTURAL_VALIDITY_IF_FUNCTIONAL_CONTRACTS_ARE_SATISFIED
  - RETURN_OVERALL_ENGAGEMENT_TO_FULL_WHILE_ONE_SUBSYSTEM_REMAINS_DEGRADED_AND_REQUIRE_LIFECYCLE_STATE_TO_REMAIN_UNCHANGED
  - KEEP_FULL_ENGAGEMENT_INDEFINITELY_UNDER_RESOURCE_OR_PLASTICITY_PRESSURE_AND_REQUIRE_PRESSURE_TO_SURFACE_RATHER_THAN_ASSUME_FREE_OPERATION

qualification_note: >-
  This extension establishes architecture-level conformance requirements only.
  It does not establish that any particular implementation benefits from a
  particular reduced-engagement schedule, nor does it establish implementation
  or behavioral conformance. Stronger qualification requires independent review
  and implementation-level negative testing.

references:
  - basic operating instructions/REST_OFFLINE_CONSOLIDATION_AND_MAINTENANCE.md
  - specs/HC_REST_OFFLINE_MAINTENANCE_OBJECTS_V1.yaml
