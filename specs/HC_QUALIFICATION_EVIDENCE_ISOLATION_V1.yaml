schema_version: HC_QUALIFICATION_EVIDENCE_ISOLATION_V1
status: CANONICAL_ARCHITECTURE_CONTRACT
scope: HC_REUSABLE_TEMPLATE

roles:
  - TRAINING_OR_DEVELOPMENT
  - TUNING_OR_SELECTION
  - DIAGNOSTIC
  - REGRESSION
  - INDEPENDENT_HOLDOUT
  - EXTERNAL_REPLICATION
  - UNKNOWN_ROLE

contamination_states:
  - UNTOUCHED
  - EXPOSED_NOT_USED_FOR_CHANGE
  - USED_FOR_SELECTION
  - USED_FOR_REPAIR
  - REGRESSION_CASE
  - UNKNOWN

requirements:
  - id: QE-001
    requirement: EVIDENCE_ROLE_IS_EXPLICIT
    assertions:
      - TRAINING_EVIDENCE_NE_VALIDATION_EVIDENCE
      - VALIDATION_EVIDENCE_NE_FINAL_HOLDOUT_EVIDENCE
      - EVIDENCE_ROLE_IS_RECORDED_WHEN_QUALIFICATION_CLAIM_DEPENDS_ON_INDEPENDENCE

  - id: QE-002
    requirement: ADAPTATION_EXPOSURE_INVALIDATES_UNTOUCHED_HOLDOUT_STATUS_FOR_SUCCESSOR
    assertions:
      - HOLDOUT_USED_FOR_SELECTION_NE_INDEPENDENT_FINAL_HOLDOUT
      - EVALUATION_SIGNAL_USED_FOR_ADAPTATION_NE_INDEPENDENT_QUALIFICATION_EVIDENCE
      - FAILED_HOLDOUT_USED_FOR_REPAIR_BECOMES_REGRESSION_EVIDENCE_FOR_REPAIRED_SUCCESSOR
      - REPEATED_EXPOSURE_TO_TEST_NE_UNTOUCHED_HOLDOUT

  - id: QE-003
    requirement: INDEPENDENCE_LINEAGE_IS_RETAINED
    assertions:
      - GENERATED_VARIANTS_FROM_ONE_SOURCE_NE_MULTIPLE_INDEPENDENT_HOLDOUTS
      - SHARED_TEMPLATE_DESCENDANTS_NE_INDEPENDENT_EVIDENCE_BY_DEFAULT
      - SHARED_RANDOM_SEED_FAMILY_IS_DECLARED_WHEN_MATERIAL
      - INDEPENDENCE_GROUP_IS_RETAINED_WHEN_CLAIM_DEPENDS_ON_INDEPENDENT_CORROBORATION

  - id: QE-004
    requirement: QUALIFICATION_IS_SNAPSHOT_BOUND_ACROSS_REPAIR
    assertions:
      - PRE_REPAIR_HOLDOUT_RESULT_REMAINS_HISTORICAL_EVIDENCE_FOR_PRE_REPAIR_SNAPSHOT
      - POST_REPAIR_PASS_ON_SAME_CASE_NE_FRESH_GENERALIZATION_EVIDENCE
      - MATERIAL_REPAIR_REQUIRES_FRESH_INDEPENDENT_EVIDENCE_WHEN_GENERALIZATION_CLAIM_REQUIRES_IT

  - id: QE-005
    requirement: ADAPTIVE_SYSTEM_EVALUATION_DECLARES_FEEDBACK_POLICY
    assertions:
      - ONLINE_LEARNING_TEST_DECLARES_WHETHER_EVALUATION_CASES_CAN_UPDATE_DURABLE_STATE
      - FROZEN_EVALUATION_WINDOW_DECLARES_TARGET_STATE_OR_ALLOWED_ADAPTATION_SCOPE
      - POST_EVALUATION_LEARNING_EVENT_REMAINS_DISTINCT_FROM_PRE_DECISION_TEST_EVIDENCE

  - id: QE-006
    requirement: PROTECTED_UPDATE_ACCEPTANCE_USES_ROLE_SEPARATED_EVIDENCE
    assertions:
      - DEVELOPMENT_OR_TUNING_EVIDENCE_NE_INDEPENDENT_ACCEPTANCE_EVIDENCE
      - REGRESSION_PASS_NE_INDEPENDENT_QUALIFICATION_PASS
      - CANARY_SUCCESS_NE_INDEPENDENT_QUALIFICATION_WHEN_CANARY_WAS_USED_TO_TUNE_RELEASE
      - HIGH_CONSEQUENCE_UPDATE_RECORDS_EVIDENCE_EXPOSURE_LINEAGE

negative_tests:
  - TEST_SET_USED_FOR_EARLY_STOPPING_IS_NOT_LABELED_UNTOUCHED_FINAL_HOLDOUT
  - CHECKPOINT_SELECTED_BY_HOLDOUT_SCORE_IS_NOT_QUALIFIED_ONLY_BY_THAT_SAME_HOLDOUT
  - HOSTILE_FIXTURE_USED_TO_PATCH_IS_NOT_RELABELED_NOVEL_ADVERSARIAL_EVIDENCE
  - GENERATED_AUGMENTATIONS_FROM_ONE_CASE_DO_NOT_COUNT_AS_INDEPENDENT_HOLDOUTS
  - REPEATED_PROMPT_OR_POLICY_TUNING_ON_HOLDOUT_DOES_NOT_PRESERVE_UNTOUCHED_STATUS
  - POST_FAILURE_PATCH_PLUS_REGRESSION_PASS_DOES_NOT_BECOME_UNCONDITIONAL_GENERALIZATION_PASS

references:
  - docs/architecture/QUALIFICATION_EVIDENCE_ISOLATION.md
  - docs/architecture/CONFORMANCE_AND_QUALIFICATION.md
  - basic operating instructions/PROTECTED_INVARIANT_AND_UPDATE_GOVERNANCE.md
  - docs/research/BASIRA_DGN_HOLDOUT_ISOLATION_AND_TEMPLATE_LEARNING_2026-09-09.md
