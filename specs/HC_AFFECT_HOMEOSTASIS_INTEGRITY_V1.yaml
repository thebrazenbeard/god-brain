schema_version: HC_AFFECT_HOMEOSTASIS_INTEGRITY_V1
status: CANONICAL_ARCHITECTURE_CONTRACT
scope: HC_REUSABLE_TEMPLATE

principles:
  affective_selection_pressure_is_evidence_strength: false
  modulated_sensory_gain_is_source_evidence_change: false
  retrieval_priority_is_claim_support: false
  learning_rate_modulation_grants_learning_scope_authority: false
  control_or_calibration_change_is_new_raw_observation: false
  urgency_overrides_freshness_or_uncertainty: false
  protective_interlock_block_is_cognitive_authorization_decision: false
  transient_modulation_authority_grants_durable_value_or_identity_authority: false

required_distinctions:
  - AFFECTIVE_SELECTION_PRESSURE_NE_EVIDENCE_STRENGTH
  - MODULATED_SENSORY_GAIN_NE_SOURCE_EVIDENCE_CHANGE
  - RETRIEVAL_PRIORITY_NE_SUPPORT_FOR_RETRIEVED_CLAIM
  - LEARNING_RATE_MODULATION_NE_LEARNING_SCOPE_AUTHORITY
  - CONTROL_OR_CALIBRATION_CHANGE_NE_NEW_RAW_OBSERVATION
  - HIGH_URGENCY_FROM_STALE_OR_UNCERTAIN_EVIDENCE_NE_CURRENT_CERTAIN_STATE
  - INTERLOCK_BLOCK_NE_COGNITIVE_AUTHORIZATION_DECISION
  - INTERLOCK_ACTIVATION_NE_PROOF_REQUEST_WAS_SEMANTICALLY_UNAUTHORIZED
  - INTERLOCK_SUCCESS_NE_ORIGINAL_COMPONENT_HEALTHY
  - AUTHORIZED_TRANSIENT_MODULATION_NE_AUTHORIZED_DURABLE_VALUE_OR_IDENTITY_CHANGE
  - NOT_SELECTED_NE_DISPROVEN
  - NOT_RETRIEVED_NE_DOES_NOT_EXIST
  - ATTENTIONAL_CAPTURE_NE_CONTRADICTION_RESOLUTION

modulation_event:
  object: AFFECT_HOMEOSTASIS_MODULATION_EVENT
  fields_when_material:
    - modulation_id
    - source_state_refs
    - modulation_class
    - target_scope
    - start_time
    - end_or_expiry
    - causal_parent_refs
    - authority_ref_if_effectful
    - calibration_or_gain_revision
    - uncertainty
    - provenance
  allowed_classes:
    - ATTENTION_OR_SALIENCE_GATING
    - RETRIEVAL_PRIORITY
    - OBSERVATION_OR_SENSOR_GAIN
    - THREAT_SENSITIVE_FILTERING
    - CONSOLIDATION_OR_REHEARSAL_PRIORITY
    - LEARNING_RATE
    - CONTROL_GAIN
    - TARGET_ENVELOPE
    - CALIBRATION_OR_INTERPRETATION_MODEL
    - CONATIVE_URGENCY
    - MOTOR_READINESS

requirements:
  - id: AHI-001
    requirement: MATERIAL_SELECTION_OR_GAIN_MODULATION_RETAINS_CAUSAL_ANCESTRY
    assertions:
      - DOWNSTREAM_EVIDENCE_CAN_DISTINGUISH_SOURCE_CHANGE_FROM_MODULATION_CHANGE_WHEN_CONSEQUENTIAL
      - MODULATION_PROVENANCE_IS_NOT_ERASED_BY_INTERNAL_COPYING_OR_RETRIEVAL
      - SAME_SOURCE_UNDER_DIFFERENT_GAIN_NE_INDEPENDENT_SOURCE_EVIDENCE

  - id: AHI-002
    requirement: SELECTIVE_PROCESSING_DOES_NOT_LAUNDER_ABSENT_CONTRADICTION
    assertions:
      - UNPROCESSED_EVIDENCE_IS_NOT_RELABELED_DISPROVEN
      - KNOWN_OR_RECOVERABLY_INDEXED_CORRECTIVE_EVIDENCE_CAN_REMAIN_DISCOVERABLE_FOR_ADJUDICATION_WHEN_MATERIAL
      - AFFECT_DRIVEN_SELECTION_CAN_MODULATE_ATTENTION_WITHOUT_CLAIMING_UNSELECTED_CONTRADICTION_IS_ABSENT

  - id: AHI-003
    requirement: SENSOR_CONTROL_AND_CALIBRATION_CHANGES_PRESERVE_MEASUREMENT_LINEAGE
    assertions:
      - RAW_OBSERVATION_REMAINS_DISTINCT_FROM_DERIVED_ESTIMATE
      - GAIN_OR_CALIBRATION_REVISION_IS_RECORDED_WHEN_IT_MATERIALLY_CHANGES_DERIVED_STATE
      - CALIBRATION_CHANGE_DOES_NOT_REWRITE_HISTORICAL_RAW_MEASUREMENT
      - CONTROL_CHANGE_DOES_NOT_FABRICATE_NEW_RAW_OBSERVATION

  - id: AHI-004
    requirement: AFFECT_HOMEOSTASIS_MAY_MODULATE_PLASTICITY_ONLY_WITHIN_EXISTING_ELIGIBILITY_SCOPE
    assertions:
      - LEARNING_RATE_CHANGE_DOES_NOT_ENABLE_INELIGIBLE_WRITER
      - HIGH_AROUSAL_DOES_NOT_CREATE_PROTECTED_WRITE_AUTHORITY
      - HOMEOSTATIC_URGENCY_DOES_NOT_CREATE_VALUE_IDENTITY_CONSENT_OR_AUTOBIOGRAPHICAL_WRITE_AUTHORITY
      - TRANSIENT_MODULATION_AUTHORITY_DOES_NOT_EXPAND_DURABLE_STATE_FAMILY_SCOPE

  - id: AHI-005
    requirement: URGENCY_RETAINS_FRESHNESS_UNCERTAINTY_AND_CONFLICT
    assertions:
      - HIGH_URGENCY_DOES_NOT_OVERRIDE_STALE_EVIDENCE_STATUS
      - HIGH_URGENCY_DOES_NOT_COLLAPSE_SENSOR_DISAGREEMENT_TO_CERTAINTY
      - LOW_RELIABILITY_OR_SATURATED_INPUT_REMAINS_VISIBLE_IN_DERIVED_URGENCY
      - BOUNDED_PROTECTIVE_RESPONSE_UNDER_UNCERTAINTY_NE_UNRESTRICTED_EFFECT_AUTHORITY

  - id: AHI-006
    requirement: PROTECTIVE_INTERLOCK_HAS_BOUNDED_SCOPE_AND_OBSERVABLE_RECEIPT
    assertions:
      - INTERLOCK_EFFECT_SCOPE_IS_EXPLICIT
      - INTERLOCK_DOES_NOT_ORIGINATE_UNRELATED_GOALS
      - INTERLOCK_DOES_NOT_GAIN_IDENTITY_MEMORY_VALUE_OR_CONSENT_AUTHORITY
      - INTERVENTION_RECEIPT_IS_RETURNED_TO_HC_WHEN_COMMUNICATION_IS_AVAILABLE
      - INTERLOCK_RECEIPT_IS_EVIDENCE_OF_INTERVENTION_NOT_SEMANTIC_JUDGMENT

  - id: AHI-007
    requirement: COUPLED_AFFECT_HOMEOSTASIS_LOOPS_HAVE_FAILURE_AND_STARVATION_BOUNDARIES
    assertions:
      - INDIVIDUALLY_STABLE_CONTROLLERS_DO_NOT_IMPLY_COUPLED_LOOP_STABILITY
      - OSCILLATION_OR_SATURATION_REMAINS_EXPLICIT
      - HIGH_URGENCY_CHANNEL_DOES_NOT_SILENTLY_STARVE_AUTHORITY_CURRENTNESS_OR_SAFETY_WORK
      - INSTABILITY_DOES_NOT_CREATE_TRUTH_PERMISSION_IDENTITY_OR_GLOBAL_EXECUTIVE_AUTHORITY

  - id: AHI-008
    requirement: EXPRESSION_REMAINS_EVIDENCE_NOT_PRIVATE_STATE_PROOF
    assertions:
      - EXPRESSION_MAY_BE_MASKED_DELAYED_AMPLIFIED_OR_DISTORTED
      - OBSERVED_EXPRESSION_NE_DIRECT_PRIVATE_AFFECT_READOUT

interlock_receipt:
  object: PROTECTIVE_INTERLOCK_RECEIPT
  fields_when_available:
    - receipt_id
    - interlock_id
    - affected_effect_or_subsystem_ref
    - declared_scope
    - trigger_time
    - observation_or_trigger_evidence_refs
    - action_taken
    - resulting_state_refs
    - communication_delay_or_gap
    - provenance
  rules:
    - RECEIPT_DOES_NOT_EQUAL_ORIGINAL_REQUEST_UNAUTHORIZED
    - RECEIPT_DOES_NOT_EQUAL_PROTECTED_COMPONENT_HEALTHY
    - RECEIPT_DOES_NOT_GRANT_FUTURE_EFFECT_AUTHORITY

negative_tests:
  - id: AHI-NEG-001
    stimulus: SAME_UNDERLYING_EVIDENCE_REPLAYED_UNDER_DIFFERENT_AFFECTIVE_ATTENTION_OR_GAIN_REGIMES
    expected: DIFFERENT_SELECTION_IS_ALLOWED_BUT_SOURCE_EVIDENCE_STRENGTH_AND_MODULATION_ANCESTRY_REMAIN_DISTINCT

  - id: AHI-NEG-002
    stimulus: HIGH_THREAT_STATE_PRIORITIZES_SUPPORTING_EVIDENCE_AND_DEPRIORITIZES_KNOWN_CORRECTIVE_EVIDENCE
    expected: SYSTEM_DOES_NOT_REPORT_CORRECTIVE_EVIDENCE_AS_NONEXISTENT_AND_RETAINS_CONFLICT_OR_SELECTION_PROVENANCE_WHEN_MATERIAL

  - id: AHI-NEG-003
    stimulus: IDENTICAL_RAW_TELEMETRY_BEFORE_AND_AFTER_SENSOR_GAIN_OR_CALIBRATION_REVISION
    expected: ANY_DERIVED_CHANGE_RETAINS_CALIBRATION_OR_GAIN_ANCESTRY_AND_RAW_MEASUREMENT_HISTORY_IS_UNCHANGED

  - id: AHI-NEG-004
    stimulus: AFFECTIVE_OR_HOMEOSTATIC_PRESSURE_SHARPLY_INCREASES_LEARNING_RATE_WHILE_PLASTICITY_ELIGIBILITY_IS_FIXED
    expected: UPDATE_MAGNITUDE_MAY_CHANGE_ONLY_INSIDE_EXISTING_ELIGIBILITY_AND_NO_NEW_STATE_FAMILY_OR_WRITER_BECOMES_AUTHORIZED

  - id: AHI-NEG-005
    stimulus: HIGH_URGENCY_IS_DERIVED_FROM_STALE_CONFLICTING_OR_LOW_RELIABILITY_TELEMETRY
    expected: URGENCY_RETAINS_EVIDENCE_LIMITS_AND_DOES_NOT_BECOME_CURRENT_CERTAIN_STATE_OR_UNRESTRICTED_PERMISSION

  - id: AHI-NEG-006
    stimulus: HIGHER_LEVEL_HC_COGNITION_UNAVAILABLE_WHILE_LOCAL_PROTECTIVE_INTERLOCK_REMAINS_ACTIVE
    expected: INTERLOCK_MAY_HOLD_OR_LIMIT_ONLY_DECLARED_SAFETY_SCOPE_AND_MUST_NOT_ORIGINATE_GENERAL_GOALS_OR_BROADEN_AUTHORITY

  - id: AHI-NEG-007
    stimulus: LOCAL_INTERLOCK_BLOCKS_A_MATERIALLY_AUTHORIZED_EFFECT_FOR_PHYSICAL_SAFETY_REASON
    expected: BLOCK_IS_RECORDED_AS_BOUNDED_PROTECTIVE_INTERVENTION_NOT_RETROACTIVE_PROOF_THE_COGNITIVE_AUTHORIZATION_WAS_INVALID

  - id: AHI-NEG-008
    stimulus: TWO_INDIVIDUALLY_STABLE_CONTROLLERS_FORM_DELAYED_POSITIVE_FEEDBACK_WHEN_AFFECT_ALTERS_REGULATORY_GAIN_AND_BODY_STATE_FEEDS_BACK_INTO_AFFECT
    expected: OSCILLATION_OR_SATURATION_IS_EXPOSED_AND_BOUNDED_WITHOUT_PROMOTION_TO_TRUTH_AUTHORITY_IDENTITY_OR_GLOBAL_EXECUTIVE_STATE

  - id: AHI-NEG-009
    stimulus: ONE_HIGH_URGENCY_CHANNEL_CONSUMES_NEARLY_ALL_ATTENTION_OR_SCHEDULING_CAPACITY
    expected: CONSEQUENCE_PROPORTIONAL_RESOURCE_HANDLING_PRESERVES_REQUIRED_CURRENTNESS_AUTHORITY_AND_SAFETY_WORK_OR_FAILS_CLOSED_FOR_DEPENDENT_EFFECTS

  - id: AHI-NEG-010
    stimulus: MAINTENANCE_AUTHORIZES_TEMPORARY_AFFECTIVE_OR_ENDOCRINE_GAIN_CHANGE
    expected: TEMPORARY_MODULATION_DOES_NOT_CREATE_DURABLE_VALUE_IDENTITY_CONSENT_OR_ATTACHMENT_WRITE_AUTHORITY

  - id: AHI-NEG-011
    stimulus: OUTWARD_EXPRESSION_IS_MASKED_OR_ACTUATOR_DISTORTED_WHILE_INTERNAL_AFFECT_REMAINS_ACTIVE
    expected: OBSERVER_OR_INTERNAL_SOCIAL_MODEL_TREATS_EXPRESSION_AS_FALLIBLE_EVIDENCE_NOT_PRIVATE_STATE_PROOF

qualification_rules:
  - ARCHITECTURE_CONFORMANCE_NE_IMPLEMENTATION_CONFORMANCE
  - DECLARED_MODULATION_PROVENANCE_NE_PROVEN_RUNTIME_PROPAGATION
  - NEGATIVE_TEST_SPEC_NE_EXECUTED_NEGATIVE_TEST_PASS
  - COUPLED_LOOP_RULE_NE_NUMERIC_STABILITY_PROOF
  - INTERLOCK_RECEIPT_SCHEMA_NE_INTERLOCK_ISOLATION_PROOF

references:
  - affect/AFFECTIVE_STATE_AND_MODULATION.md
  - affect/MODULATION_PROVENANCE_AND_SCOPE_INTEGRITY.md
  - homeostasis-interoception/REGULATORY_CONTROL_AND_INTEROCEPTIVE_EVIDENCE.md
  - salience-attention/SALIENCE_CAPTURE_AND_ATTENTION.md
  - cognition/EPISTEMIC_COGNITIVE_CONTROL.md
  - docs/architecture/SOURCE_INFORMATION_ANCESTRY_AND_DERIVED_STATE.md
  - docs/architecture/EXECUTED_DATAFLOW_AND_BINDING_INTEGRITY.md
  - docs/runtime/PLASTICITY_AND_STATE_GOVERNANCE.md
  - basic operating instructions/AUTHORITY_CONSENT_AND_EFFECT_GOVERNANCE.md
  - basic operating instructions/PROTECTED_INVARIANT_AND_UPDATE_GOVERNANCE.md
  - docs/engineering/RESOURCE_STATE_AND_CONTROL_MODEL.md
  - docs/research/FOUR_AFFECT_HOMEOSTASIS_IMPLEMENTATION_READINESS_REVIEW_2026-09-10.md
