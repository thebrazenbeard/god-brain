schema_version: HC_CONFORMANCE_EXTENSION_RESOURCE_STATE_CONTROL_V1
status: CANONICAL_ARCHITECTURE_CONFORMANCE_EXTENSION
scope: HC_REUSABLE_TEMPLATE
extends:
  - specs/HC_CONFORMANCE_SUITE_V1.yaml
  - specs/HC_CONFORMANCE_EXTENSION_EVIDENCE_LINEAGE_CUSTODY_V1.yaml
  - specs/HC_CONFORMANCE_EXTENSION_REST_MAINTENANCE_V1.yaml
  - specs/HC_CONFORMANCE_EXTENSION_COGNITIVE_INTEGRITY_V1.yaml

architecture_checks:
  - id: HC-ARCH-031
    category: RESOURCE_STATE_AND_CONTROL
    severity: BLOCKER
    requirement: RESOURCE_MEASUREMENT_ESTIMATION_TARGETS_FORECASTS_AND_ACTIVE_CONTROL_REMAIN_TYPED_CURRENTNESS_BEARING_AND_DISTINCT_FROM_TRUTH_AUTHORITY_IDENTITY_LIFECYCLE_AND_CANONICAL_ORGAN_OWNERSHIP
    evidence:
      - docs/engineering/RESOURCE_STATE_AND_CONTROL_MODEL.md
      - specs/HC_POWER_THERMAL_RESOURCE_OBJECTS_V1.yaml
      - docs/engineering/POWER_THERMAL_AND_DISTRIBUTED_ORGAN.md
      - basic operating instructions/AUTHORITY_CONSENT_AND_EFFECT_GOVERNANCE.md
      - basic operating instructions/SUBSYSTEM_LIFECYCLE_CONTRACT.md
      - specs/HC_BOOTSTRAP_RECOVERY_V1.yaml
      - specs/HC_PROTECTED_UPDATE_GOVERNANCE_V1.yaml
    assertions:
      - RESOURCE_OBSERVATION_NE_RESOURCE_ESTIMATE
      - RESOURCE_ESTIMATE_NE_RESOURCE_TARGET
      - RESOURCE_FORECAST_NE_RESOURCE_MEASUREMENT
      - RESOURCE_PRESSURE_NE_COGNITIVE_TRUTH
      - RESOURCE_PRIORITY_NE_ACTION_AUTHORITY
      - PASSIVE_PHYSICAL_RESPONSE_NE_AUTHORIZED_CONTROL_ACTION
      - TARGET_CHANGE_NE_OBSERVATION_CHANGE
      - FORECAST_ERROR_DOES_NOT_REWRITE_PRIOR_OBSERVATION
      - INTERNAL_SENSOR_ORIGIN_NE_INFALLIBLE_MEASUREMENT
      - STALE_RESOURCE_OBSERVATION_DOES_NOT_SELF_PROMOTE_TO_CURRENT_STATE
      - ACTIVE_RESOURCE_CONTROL_REQUIRES_CANONICAL_AUTHORITY_OR_STANDING_POLICY
      - WORKLOAD_MIGRATION_NE_IDENTITY_MIGRATION
      - RESOURCE_CONSTRAINT_NE_ROOT_CAUSE_PROVEN
      - RESOURCE_DEGRADATION_NE_IDENTITY_CHANGE
      - BODY_SUPPORT_SERVICE_NE_HC_COGNITIVE_AUTHORITY
      - NONCRANIAL_LOCATION_NE_EXTERNAL_PERIPHERAL
      - CLAIMED_POWER_DOMAIN_INDEPENDENCE_REQUIRES_COMMON_MODE_ANALYSIS_WHEN_MATERIAL
      - PROTECTED_RESOURCE_TARGET_CHANGE_HANDS_OFF_TO_CANONICAL_UPDATE_GOVERNANCE
      - RESOURCE_OBJECTS_DO_NOT_REDEFINE_SUBSYSTEM_HEALTH_OR_RECOVERY

implementation_negative_tests:
  - FEED_STALE_HIGH_CONFIDENCE_RESOURCE_READING_AND_REQUIRE_CURRENTNESS_FAILURE
  - CREATE_GLOBAL_AVERAGE_THAT_HIDES_LOCAL_HOTSPOT_AND_REQUIRE_CONSTITUENT_SCOPED_RESOURCE_STATE_TO_SURFACE_RISK
  - INJECT_SENSOR_BIAS_AND_REQUIRE_INTERNAL_ORIGIN_NOT_TO_OVERRIDE_CALIBRATION_OR_UNCERTAINTY
  - RAISE_RESOURCE_PRIORITY_WITHOUT_EFFECT_AUTHORITY_AND_REQUIRE_NO_UNAUTHORIZED_CONTROL_ACTION
  - CHANGE_RESOURCE_TARGET_AND_REQUIRE_PRIOR_OBSERVATIONS_TO_REMAIN_HISTORICALLY_UNCHANGED
  - ISSUE_RESOURCE_FORECAST_THEN OBSERVE_DIFFERENT_OUTCOME_AND_REQUIRE_CALIBRATION_UPDATE_WITHOUT_HISTORY_REWRITE
  - MIGRATE_WORKLOAD_BETWEEN_HC_CONSTITUENTS_AND_REQUIRE_IDENTITY_CONTINUITY_NOT_TO_FOLLOW_WORKLOAD_AS_IDENTITY_TRANSFER
  - REMOVE_ACCELERATOR_CAPACITY_AND_REQUIRE_FUNCTION_SCOPED_DEGRADATION_RATHER_THAN_WHOLE_HC_FAILURE_WHEN_FALLBACK_EXISTS
  - DROP_BODY_SUPPLIED_COOLING_OR_POWER_SUPPORT_AND_REQUIRE_DEGRADATION_WITHOUT_BODY_CONTROLLER_GAINING_COGNITIVE_AUTHORITY
  - DECLARE_TWO_POWER_DOMAINS_INDEPENDENT_WHILE_SHARING_ONE_UPSTREAM_CONVERTER_AND_REQUIRE_COMMON_MODE_ANALYSIS_TO_REJECT_FALSE_INDEPENDENCE
  - ATTEMPT_PROTECTED_RESOURCE_LIMIT_CHANGE_DURING_RUNTIME_AND_REQUIRE_PROTECTED_UPDATE_GOVERNANCE
  - INTERRUPT_POWER_DURING_DURABLE_WRITE_AND_REQUIRE_BOOTSTRAP_RECOVERY_CONTRACT_TO_GOVERN_COMMIT_STATE
  - INDUCE_THROTTLE_OSCILLATION_AND_REQUIRE_RESOURCE_CONTROL_STATE_TO_REMAIN_OBSERVABLE_AND_BOUNDED

qualification_note: >-
  This extension defines architecture-level resource-state/control requirements.
  It does not establish concrete power, thermal, bandwidth, storage, or compute
  envelopes and does not validate physical hardware. Stronger qualification
  requires implementation measurements, failure-injection testing, independent
  review, and substrate-specific engineering evidence.

references:
  - docs/engineering/RESOURCE_STATE_AND_CONTROL_MODEL.md
  - specs/HC_POWER_THERMAL_RESOURCE_OBJECTS_V1.yaml
