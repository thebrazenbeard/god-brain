name: Repository Hygiene

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact workflow subject
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: repo
          persist-credentials: false
          fetch-depth: 1
      - name: Validate exact workflow subject diff
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: python3 repo/tools/validate_workflow_subject_diff.py

      - name: Compile Python
        working-directory: repo
        run: python3 -m compileall -q tools tests runtime

      - name: Validate immutable workflow action references
        working-directory: repo
        run: python3 tools/validate_github_workflow_supply_chain.py

      - name: Parse JSON contracts
        working-directory: repo
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          for path in sorted(Path(".").rglob("*.json")):
              with path.open("r", encoding="utf-8") as handle:
                  json.load(handle)
              print(path)
          PY

      - name: Run repository unit-test discovery
        working-directory: repo
        run: python3 -m unittest discover -s tests -p 'test_*.py'
