name: Experiment admission architecture research

on:
  push:
    paths:
      - "docs/research/GOD_BRAIN_EXPERIMENT_ADMISSION_ARCHITECTURE_V0_1.md"
      - "specs/research/GOD_BRAIN_EXPERIMENT_ADMISSION_ARCHITECTURE_V0_1.json"
      - "tools/validate_god_brain_experiment_admission.py"
      - "tests/test_validate_god_brain_experiment_admission.py"
      - ".github/workflows/experiment-admission-architecture-research.yml"
  pull_request:
    paths:
      - "docs/research/GOD_BRAIN_EXPERIMENT_ADMISSION_ARCHITECTURE_V0_1.md"
      - "specs/research/GOD_BRAIN_EXPERIMENT_ADMISSION_ARCHITECTURE_V0_1.json"
      - "tools/validate_god_brain_experiment_admission.py"
      - "tests/test_validate_god_brain_experiment_admission.py"
      - ".github/workflows/experiment-admission-architecture-research.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python tools/validate_god_brain_experiment_admission.py
      - run: python -m unittest tests.test_validate_god_brain_experiment_admission
      - run: python -m compileall -q tools tests
      - run: git diff --check HEAD^ HEAD
