name: Reference Kernel

on:
  push:
    paths:
      - "runtime/reference_kernel/**"
      - ".github/workflows/reference-kernel.yml"
  pull_request:
    paths:
      - "runtime/reference_kernel/**"
      - ".github/workflows/reference-kernel.yml"

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - name: Clone current repository state
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          git clone --no-checkout "https://x-access-token:${GITHUB_TOKEN}@github.com/${REPOSITORY}.git" repo
          cd repo
          git checkout --detach "${COMMIT_SHA}"
      - name: Run reference-kernel tests
        working-directory: repo/runtime/reference_kernel
        run: >-
          python3 -m unittest -v
          test_hc_kernel.py
          test_durable_kernel.py
          test_four_adversarial_kernel.py
          test_four_adversarial_kernel_r2.py
