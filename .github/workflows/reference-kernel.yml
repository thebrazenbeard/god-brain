name: Reference Kernel

on:
  push:
    paths:
      - "runtime/reference_kernel/**"
      - ".github/workflows/reference-kernel.yml"
  pull_request:
    paths:
      - "runtime/reference_kernel/**"
      - ".github/workflows/reference-kernel.yml"

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact workflow subject
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: repo
          persist-credentials: false
      - name: Run reference-kernel tests
        working-directory: repo/runtime/reference_kernel
        run: >-
          python3 -m unittest -v
          test_hc_kernel.py
          test_durable_kernel.py
          test_four_adversarial_kernel.py
          test_four_adversarial_kernel_r2.py
          test_vera_adversarial_kernel_v2.py
