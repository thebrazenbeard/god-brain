# This workflow executes only trusted base-branch policy code.
# The pull request checkout is treated strictly as data; never run its scripts.
name: Workspace source-only hygiene

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-workspace-data:
    runs-on: ubuntu-latest
    steps:
      - name: Check out trusted policy source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          path: guard
          fetch-depth: 1
          persist-credentials: false
      - name: Check out candidate without executing it
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: candidate
          fetch-depth: 1
          persist-credentials: false

      - name: Validate candidate source only
        run: python3 guard/tools/validate_workspace_hygiene.py --root candidate
