name: Architecture Conformance

on:
  push:
    paths:
      - "docs/architecture/**"
      - "specs/**"
      - "tools/validate_hc_architecture.py"
      - "tests/test_validate_hc_architecture.py"
      - ".github/workflows/architecture-conformance.yml"
  pull_request:
    paths:
      - "docs/architecture/**"
      - "specs/**"
      - "tools/validate_hc_architecture.py"
      - "tests/test_validate_hc_architecture.py"
      - ".github/workflows/architecture-conformance.yml"

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - name: Clone exact workflow subject
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          git clone --no-checkout "https://x-access-token:${GITHUB_TOKEN}@github.com/${REPOSITORY}.git" repo
          cd repo
          git checkout --detach "${COMMIT_SHA}"
      - name: Run architecture validator unit tests
        working-directory: repo
        run: python3 -m unittest -v tests.test_validate_hc_architecture
      - name: Validate repository V2 conformance surface
        working-directory: repo
        run: python3 tools/validate_hc_architecture.py --root .
