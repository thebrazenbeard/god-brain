name: Architecture Conformance

on:
  push:
    paths:
      - "docs/architecture/**"
      - "specs/**"
      - "tools/validate_hc_architecture.py"
      - "tests/test_validate_hc_architecture.py"
      - ".github/workflows/architecture-conformance.yml"
  pull_request:
    paths:
      - "docs/architecture/**"
      - "specs/**"
      - "tools/validate_hc_architecture.py"
      - "tests/test_validate_hc_architecture.py"
      - ".github/workflows/architecture-conformance.yml"

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact workflow subject
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: repo
          persist-credentials: false
      - name: Run architecture validator unit tests
        working-directory: repo
        run: python3 -m unittest -v tests.test_validate_hc_architecture
      - name: Validate repository V2 conformance surface
        working-directory: repo
        run: python3 tools/validate_hc_architecture.py --root .
