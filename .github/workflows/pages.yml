name: Deploy God Brain research interface

on:
  pull_request:
    paths:
      - 'site/**'
      - 'tests/test_public_site.py'
      - 'tests/test_pages_dialogue*.py'
      - 'tests/test_dialogue_composer.cjs'
      - '.github/workflows/pages.yml'
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'tests/test_public_site.py'
      - 'tests/test_pages_dialogue*.py'
      - 'tests/test_dialogue_composer.cjs'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact workflow subject
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check public site and composer invariants
        run: |
          python3 -m unittest discover -s tests -p 'test_public_site.py' -v
          python3 -m unittest discover -s tests -p 'test_pages_dialogue*.py' -v
          node --test tests/test_dialogue_composer.cjs

  deploy:
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout exact workflow subject
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Configure existing GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: ./site
      - name: Publish to configured Pages environment
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
