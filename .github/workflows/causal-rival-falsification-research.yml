name: Causal-rival falsification research

on:
  push:
    paths:
      - "docs/research/GOD_BRAIN_CAUSAL_RIVAL_FALSIFICATION_V0_1.md"
      - "specs/research/GOD_BRAIN_CAUSAL_RIVAL_FALSIFICATION_V0_1.json"
      - "tools/validate_god_brain_causal_rival_falsification.py"
      - "tests/test_validate_god_brain_causal_rival_falsification.py"
      - ".github/workflows/causal-rival-falsification-research.yml"
  pull_request:
    paths:
      - "docs/research/GOD_BRAIN_CAUSAL_RIVAL_FALSIFICATION_V0_1.md"
      - "specs/research/GOD_BRAIN_CAUSAL_RIVAL_FALSIFICATION_V0_1.json"
      - "tools/validate_god_brain_causal_rival_falsification.py"
      - "tests/test_validate_god_brain_causal_rival_falsification.py"
      - ".github/workflows/causal-rival-falsification-research.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python tools/validate_god_brain_causal_rival_falsification.py
      - run: python -m unittest tests.test_validate_god_brain_causal_rival_falsification
      - run: python -m compileall -q tools tests
      - run: git diff --check HEAD^ HEAD
