name: Causal-rival falsification research

on:
  push:
    paths:
      - "docs/research/GOD_BRAIN_CAUSAL_RIVAL_FALSIFICATION_V0_1.md"
      - "specs/research/GOD_BRAIN_CAUSAL_RIVAL_FALSIFICATION_V0_1.json"
      - "tools/validate_god_brain_causal_rival_falsification.py"
      - "tests/test_validate_god_brain_causal_rival_falsification.py"
      - ".github/workflows/causal-rival-falsification-research.yml"
  pull_request:
    paths:
      - "docs/research/GOD_BRAIN_CAUSAL_RIVAL_FALSIFICATION_V0_1.md"
      - "specs/research/GOD_BRAIN_CAUSAL_RIVAL_FALSIFICATION_V0_1.json"
      - "tools/validate_god_brain_causal_rival_falsification.py"
      - "tests/test_validate_god_brain_causal_rival_falsification.py"
      - ".github/workflows/causal-rival-falsification-research.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Clone exact workflow subject
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          git clone --no-checkout "https://x-access-token:${GITHUB_TOKEN}@github.com/${REPOSITORY}.git" repo
          cd repo
          git fetch origin "${BASE_SHA}" "${HEAD_SHA}"
          git checkout --detach "${HEAD_SHA}"
          git diff --check "${BASE_SHA}..${HEAD_SHA}"

      - name: Validate causal-rival protocol
        working-directory: repo
        run: python3 tools/validate_god_brain_causal_rival_falsification.py

      - name: Run hostile regression tests
        working-directory: repo
        run: python3 -m unittest -v tests.test_validate_god_brain_causal_rival_falsification

      - name: Compile Python
        working-directory: repo
        run: python3 -m compileall -q tools tests
