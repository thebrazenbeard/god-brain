name: Simulation Testability Research Conformance

on:
  push:
    paths:
      - "docs/research/GOD_BRAIN_SIMULATION_TESTABILITY_BOUNDARY_V0_1.md"
      - "specs/research/GOD_BRAIN_SIMULATION_TESTABILITY_BOUNDARY_V0_1.json"
      - "specs/research/fixtures/GOD_BRAIN_SIMULATION_TESTABILITY_HOSTILE_CASES_V0_1.json"
      - "tools/validate_god_brain_simulation_testability.py"
      - "tests/test_validate_god_brain_simulation_testability.py"
      - ".github/workflows/simulation-testability-research.yml"
  pull_request:
    paths:
      - "docs/research/GOD_BRAIN_SIMULATION_TESTABILITY_BOUNDARY_V0_1.md"
      - "specs/research/GOD_BRAIN_SIMULATION_TESTABILITY_BOUNDARY_V0_1.json"
      - "specs/research/fixtures/GOD_BRAIN_SIMULATION_TESTABILITY_HOSTILE_CASES_V0_1.json"
      - "tools/validate_god_brain_simulation_testability.py"
      - "tests/test_validate_god_brain_simulation_testability.py"
      - ".github/workflows/simulation-testability-research.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run simulation testability tests
        run: python3 -m unittest -v tests.test_validate_god_brain_simulation_testability
      - name: Validate simulation testability boundary
        run: python3 tools/validate_god_brain_simulation_testability.py --root .
