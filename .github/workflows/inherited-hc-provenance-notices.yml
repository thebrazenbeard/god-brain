name: Inherited HC provenance notices

on:
  push:
    paths:
      - "WARDEN.md"
      - "docs/REPOSITORY_MAP.md"
      - "tools/validate_inherited_hc_notices.py"
      - "tests/test_validate_inherited_hc_notices.py"
      - ".github/workflows/inherited-hc-provenance-notices.yml"
  pull_request:
    paths:
      - "WARDEN.md"
      - "docs/REPOSITORY_MAP.md"
      - "tools/validate_inherited_hc_notices.py"
      - "tests/test_validate_inherited_hc_notices.py"
      - ".github/workflows/inherited-hc-provenance-notices.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact workflow subject
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: repo
          persist-credentials: false
          fetch-depth: 1
      - name: Validate exact workflow subject diff
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: python3 repo/tools/validate_workflow_subject_diff.py
      - name: Validate inherited HC notices
        working-directory: repo
        run: python3 tools/validate_inherited_hc_notices.py
      - name: Run notice regression tests
        working-directory: repo
        run: python3 -m unittest -v tests.test_validate_inherited_hc_notices
