name: Anomaly Contact Protocol Research Conformance

on:
  push:
    paths:
      - "docs/research/GOD_BRAIN_ANOMALY_CONTACT_EVIDENCE_PROTOCOL_V0_1.md"
      - "specs/research/GOD_BRAIN_ANOMALY_CONTACT_EVIDENCE_PROTOCOL_V0_1.json"
      - "specs/research/fixtures/GOD_BRAIN_ANOMALY_CONTACT_HOSTILE_CASES_V0_1.json"
      - "tools/validate_god_brain_anomaly_contact_protocol.py"
      - "tests/test_validate_god_brain_anomaly_contact_protocol.py"
      - ".github/workflows/anomaly-contact-protocol-research.yml"
  pull_request:
    paths:
      - "docs/research/GOD_BRAIN_ANOMALY_CONTACT_EVIDENCE_PROTOCOL_V0_1.md"
      - "specs/research/GOD_BRAIN_ANOMALY_CONTACT_EVIDENCE_PROTOCOL_V0_1.json"
      - "specs/research/fixtures/GOD_BRAIN_ANOMALY_CONTACT_HOSTILE_CASES_V0_1.json"
      - "tools/validate_god_brain_anomaly_contact_protocol.py"
      - "tests/test_validate_god_brain_anomaly_contact_protocol.py"
      - ".github/workflows/anomaly-contact-protocol-research.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact workflow subject
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: repo
          persist-credentials: false
          fetch-depth: 1
      - name: Validate exact workflow subject diff
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          git -C repo fetch --no-tags --depth=1 origin "${BASE_SHA}"
          git -C repo diff --check "${BASE_SHA}..${HEAD_SHA}"
      - name: Validate anomaly/contact protocol
        working-directory: repo
        run: python3 tools/validate_god_brain_anomaly_contact_protocol.py
      - name: Run hostile regression tests
        working-directory: repo
        run: python3 -m unittest -v tests.test_validate_god_brain_anomaly_contact_protocol
      - name: Compile Python
        working-directory: repo
        run: python3 -m compileall -q tools tests
